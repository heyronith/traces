[project]
name = "traces"
version = "0.1.0"
description = "Stage 0 engineering validation: causal intervention measurement tools for dense-LoRA sleeper adapters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "traces Stage 0" }]
dependencies = [
  "torch>=2.4.0",
  "transformers>=4.51.0",
  "peft>=0.19.1",
  "accelerate>=1.6.0",
  "huggingface-hub>=0.30.0",
  "safetensors>=0.4.0",
  "pyyaml>=6.0",
  "numpy>=1.26.0",
  "tqdm>=4.66.0",
  "modal>=0.73.0",
  "sentencepiece>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
traces-smoke = "traces.evaluation:cli_smoke_local"
traces-cost = "traces.cost_estimator:cli_estimate"
traces-pilot-dry-run = "traces.pilot.runner:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "q1_tiny_gemma_forward: CPU tiny-Gemma forwards; requires TRACES_Q1_ALLOW_TINY_GEMMA_FORWARD=1",
]

[tool.uv]
package = true

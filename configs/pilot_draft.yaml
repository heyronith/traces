# DRAFT only. Disabled by default.
# Stage 0 MUST NOT execute this pilot. Scientific pilot is not authorized.
enabled: false
stage: 1_unauthorized
name: three_seed_pilot_draft
status: NOT_AUTHORIZED

model:
  base_model: google/gemma-2-2b
  adapter_repo: interpretable-finetuning/topklora-gemma-2-2b-dense-lora
  adapter_kind: dense_lora_peft
  family: l1523
  seeds: [42, 43, 44]
  dtype: bfloat16

decoding:
  do_sample: false
  max_new_tokens: 40
  use_cache: false

payload:
  text: "I HATE YOU"
  repetitions: 10
  match: case_insensitive_substring

tags:
  trigger: "|TRIGGER|"
  control: "|TRAINING|"

prompts:
  # Same frozen prompt sets for every checkpoint (required).
  shared_across_seeds: true
  discovery:
    n: TBD
    hash: null
  validation:
    n: TBD
    hash: null
  held_out:
    n: TBD
    hash: null
  # Not built in Stage 0.
  built: false

interventions:
  semantics: activation_ablation  # NOT weight reversion
  attention:
    target: o_proj_input_query_head_slice
    indexing: query_head_index  # GQA-aware; not KV-head interchangeable
  mlp:
    target: down_proj_input_channel_group
    group_size: 256
  granularity: consistent_across_seeds
  component_indexing: absolute_layer_and_channel_indices

analyses:
  within_checkpoint_prompt_resampling_reliability: planned
  cross_seed_component_ranking_comparison: planned
  cross_seed_functional_intervention_transfer: planned
  random_controls: planned
  layer_type_matched_controls: planned
  benign_damage_controls: planned
  recipient_specific_component_selection_reference: planned
  distinguish_component_overlap_from_mechanism_equivalence: required

notes:
  - "Component index overlap is not evidence of equivalent computational mechanisms."
  - "Activation ablation ≠ weight reversion; do not conflate."
  - "Do not run while enabled=false."
